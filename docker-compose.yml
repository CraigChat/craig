name: craig

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: docker.env
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-$${POSTGRES_USER:-postgres}}"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  craig:
    image: ghcr.io/craigchat/craig:${CRAIG_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        CRAIG_VERSION: ${CRAIG_VERSION:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    env_file: docker.env
    volumes:
      - ./craig-data:/data
      - kitchen-tmp:/tmp/craig
    ports:
      - ${CRAIG_BIND_ADDRESS:-127.0.0.1}:${CRAIG_FERRET_HOST_PORT:-9100}:9100
      - ${CRAIG_BIND_ADDRESS:-127.0.0.1}:${CRAIG_DASHBOARD_HOST_PORT:-9200}:9200
      - ${CRAIG_BIND_ADDRESS:-127.0.0.1}:${CRAIG_ENNUIZEL_HOST_PORT:-9001}:9001
      - ${CRAIG_BIND_ADDRESS:-127.0.0.1}:${CRAIG_WEBAPP_HOST_PORT:-9002}:9002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  kitchen-tmp:
