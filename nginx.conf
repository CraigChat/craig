# These NGINX rules are used for the public-facing services
# Make sure to update the config accordingly to use the proper server names and SSL config

# Recording URLs carry access/delete keys in the query string (?key=...&delete=...),
# so strip query strings from the request line and referrer before logging
map $request_uri $craig_log_path {
  "~^(?<path>[^?]*)" $path;
  default $request_uri;
}
map $http_referer $craig_log_referer {
  "~^(?<ref>[^?]*)" $ref;
  default $http_referer;
}
log_format craig_redacted '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $craig_log_path $server_protocol" $status $body_bytes_sent '
                          '"$craig_log_referer" "$http_user_agent"';

# Ferret
server {
  server_name ferret.local;

  listen 80;

  access_log /var/log/nginx/access.log craig_redacted;

  add_header Referrer-Policy strict-origin always;

  # listen 443 ssl;
  # ssl_certificate /etc/ssl/cloudflare/cloudflare_cert.pem;
  # ssl_certificate_key /etc/ssl/cloudflare/cloudflare_key.pem;

  location / {
    proxy_pass http://localhost:9100;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* ^/api/v1/recordings/\w+/sse(?:$|/) {
      proxy_pass http://localhost:9100;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
    }

    location ~* ^/api/v1/recordings/\w+/raw\.dat(?:$|\?) {
      proxy_pass http://localhost:9100;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_connect_timeout 60s;
      send_timeout 3600s;
      keepalive_timeout 3600s;
    }

    location = /api/ennuizel {
      proxy_pass http://localhost:9001;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }
  }

  # Used when DOWNLOADS_ACCEL_PATH=/_accel_dl/ is set; nginx then serves finished downloads itself.
  # Docker: point this at the host's craig-data/downloads/ (nginx needs read access to it).
  location /_accel_dl/ {
    internal;
    alias /path/to/craig/downloads/;
    sendfile on;
    tcp_nopush on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;
  }
}

